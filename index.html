.home-timeline{border-left:2px solid var(--line); margin-left:8px; padding-left:22px; display:flex; flex-direction:column; gap:20px;}

.tl-date{font-family:var(--mono); font-size:12px; color:var(--forest); font-weight:600;}

.trap-box{ background:#eaf0e7; border-left:3px solid var(--forest); border-radius:6px; padding:10px 12px; font-size:13px; color:#20351d; margin-top:8px; display:flex; gap:8px; }

.glossary-grid{display:grid; grid-template-columns:1fr; gap:10px;}
.g-card{background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px 16px;}
.g-term{font-family:var(--serif); font-weight:700; color:var(--brick); font-size:15px;}
.g-abbr{font-family:var(--mono); font-size:11px; color:var(--forest); margin-left:6px;}
.g-def{font-size:13.5px; color:var(--ink-soft); margin-top:4px; line-height:1.55;}

.quiz-box{background:#fff; border:1px solid var(--line); border-radius:12px; padding:22px;}

  all:unset; box-sizing:border-box; cursor:pointer; display:block; padding:11px 14px;

.quiz-nav{display:flex; justify-content:space-between; align-items:center; margin-top:18px;}
.btn{ all:unset; cursor:pointer; font-family:var(--sans); font-weight:600; font-size:13px; background:var(--brick); color:#f7f0da; padding:10px 18px; border-radius:7px; }
.btn:hover{background:var(--brick-2);}
.btn.ghost{background:transparent; color:var(--ink-soft); border:1px solid var(--line);}
.quiz-score{font-family:var(--serif); font-size:22px; color:var(--brick); text-align:center; padding:20px 0;}
.quiz-score .sub{font-family:var(--sans); font-size:13px; color:var(--ink-soft); font-weight:400; margin-top:6px;}

.hidden{display:none !important;}
.nores{padding:40px 0; text-align:center; color:var(--ink-soft); font-size:14px;}
</style>

<script>
const dates=[{"date": "1987", "title": "1987 Constitution, Art. XIII, Sec. 9-10", "desc": "Mandates a continuing urban land reform and housing program, security of tenure, and provides urban/rural poor dwellers shall not be evicted nor dwellings demolished except in accordance with law and in a just and humane manner."}, {"date": "Mar 24, 1992", "title": "RA 7279 (UDHA) enacted", "desc": "'Urban Development and Housing Act of 1992' — signed by Pres. Corazon C. Aquino; comprehensive national urban development and housing program; original balanced housing rate was 20%, subdivisions of 5 hectares or more."}, {"date": "2002", "title": "EO 152, s. 2002", "desc": "Designates the Presidential Commission for the Urban Poor (PCUP) as the sole Clearing House for demolition/eviction activities involving homeless and underprivileged citizens."}, {"date": "2009", "title": "RA 9646 — RESA Law", "desc": "Professionalizes real estate service practice; brokers/appraisers must understand UDHA's balanced housing and eviction rules."}, {"date": "Feb 3 & May 23, 2016", "title": "RA 10884 passed by Congress", "desc": "Passed by the Senate and House; amends Secs. 3(r), 18 and 20 of RA 7279."}, {"date": "Jul 17, 2016", "title": "RA 10884 lapses into law", "desc": "Signed by no one — lapsed into law without the signature of Pres. Benigno S. Aquino III, under Art. VI, Sec. 27(1) of the Constitution (a bill becomes law if the President neither signs nor vetoes it within 30 days of receipt)."}, {"date": "2019", "title": "RA 11201 — DHSUD Act", "desc": "Creates the DHSUD, absorbing HLURB and HUDCC; DHSUD and HSAC take over UDHA implementation and adjudication functions."}];
const people=[{"name": "Pres. Corazon C. Aquino", "role": "Signed RA 7279 (Mar 24, 1992)", "desc": "Enacted the original UDHA, setting the first balanced-housing rate at 20% for subdivisions of 5 hectares or more."}, {"name": "Pres. Benigno S. Aquino III", "role": "Did NOT sign RA 10884", "desc": "RA 10884 lapsed into law on Jul 17, 2016 without his signature — a rare, exam-worthy occurrence under Art. VI Sec. 27(1) of the Constitution."}, {"name": "HUDCC (Housing and Urban Development Coordinating Council)", "role": "Original coordinating body", "desc": "Jointly sets/reviews socialized housing price ceilings with NEDA, every 2 years; later absorbed into DHSUD (2019)."}, {"name": "HLURB", "role": "Regulator; issues balanced-housing IRR", "desc": "Mandated under RA 10884 to issue new IRR within 90 days of effectivity, and to submit an ANNUAL report to Congress on developer compliance."}, {"name": "DHSUD / HSAC", "role": "Current implementing/adjudicating bodies", "desc": "RA 11201 (2019) absorbed HLURB and HUDCC into DHSUD; HSAC adjudicates UDHA disputes, appealable to the CA via Rule 43."}, {"name": "PCUP (Presidential Commission for the Urban Poor)", "role": "Sole Clearing House for demolitions", "desc": "Designated by EO 152 (2002) to clear all eviction/demolition activities involving homeless and underprivileged citizens."}, {"name": "LGUs (barangay, municipal, city)", "role": "Front-line implementers", "desc": "Charged under Sec. 9 of RA 7279 with implementing the Act locally, in coordination with HUDCC/DHSUD; must also prevent new illegal structures after RA 7279's effectivity."}, {"name": "Underprivileged and homeless citizens", "role": "Primary beneficiaries", "desc": "The class of persons UDHA and its balanced-housing/eviction protections are designed to protect."}];
const glossary=[{"term": "Balanced Housing Development", "abbr": "Sec. 18", "def": "Requirement that subdivision/condo developers allocate a percentage of area or project cost to socialized housing."}, {"term": "Socialized housing", "abbr": "Sec. 3(r), as amended", "def": "Housing programs/projects (houses and lots, homelots, OR condo units) for underprivileged and homeless citizens, including financing and liberalized terms."}, {"term": "Underprivileged and homeless citizens", "abbr": "Sec. 3", "def": "The beneficiary class of UDHA — individuals/families lacking decent housing, within the poverty threshold."}, {"term": "Professional squatters", "abbr": "Sec. 3", "def": "Occupants with sufficient income for legitimate housing who nonetheless occupy land illegally, or who previously benefited from government housing and illegally occupy again."}, {"term": "Squatting syndicates", "abbr": "Sec. 3", "def": "Organized groups engaged in the business of illegal land occupation for profit."}, {"term": "Danger areas", "abbr": "Sec. 28", "def": "Esteros, railroad tracks, garbage dumps, riverbanks, shorelines, waterways, easements — grounds justifying eviction even without full Sec. 28 procedure in some cases."}, {"term": "Summary eviction", "abbr": "Secs. 27, 44", "def": "Expedited eviction for new squatters (post-RA 7279 construction) and professional squatters/syndicates, without the full Sec. 28 checklist."}, {"term": "Just and humane manner", "abbr": "Art. XIII Sec. 10 / Sec. 28", "def": "Constitutional and statutory standard governing all evictions/demolitions of urban/rural poor dwellers."}, {"term": "Community Mortgage Program (CMP)", "abbr": "Sec. 18 compliance option", "def": "Financing scheme (via SHFC) for organized underprivileged/homeless associations to acquire land collectively."}, {"term": "One-stop offices", "abbr": "Sec. 20, as amended", "def": "Regional offices for streamlined processing of clearances/permits/licenses, with a 90-day issuance mandate."}, {"term": "HSAC", "abbr": "RA 11201", "def": "Human Settlements Adjudication Commission — current adjudicator of UDHA disputes."}];
const udhaArticles=[{"heading": "Constitutional Basis and Purpose", "tag": "Art. XIII, Secs. 9-10", "sections": [{"num": "Constitutional mandate", "title": "Continuing urban land reform and housing program", "body": "<p>Art. XIII, Sec. 9 directs Congress to undertake a <span class='kw'>continuing program of urban land reform and housing</span>, providing decent housing at affordable cost, ensuring <span class='kw'>security of tenure</span>, and adopting an urban land policy securing the rights of both owners and occupants.</p>"}, {"num": "Sec. 10 (eviction clause)", "title": "Just and humane manner requirement", "body": "<p>'Urban and rural poor dwellers shall not be evicted nor their dwellings demolished, except in accordance with law and in a just and humane manner' — this is the constitutional root of <span class='kw'>Sec. 28 of RA 7279</span>.</p>"}, {"num": "RA 7279's role", "title": "Operationalizing the constitutional mandate", "body": "<p>UDHA (1992) is the statute that <span class='kw'>operationalizes</span> these constitutional directives: a national housing program, beneficiary qualification rules, balanced housing, and the eviction/demolition safeguards.</p>"}]}, {"heading": "Key Definitions (Sec. 3)", "tag": "", "sections": [{"num": "Underprivileged and homeless citizens", "title": "Primary beneficiary class", "body": "<p>Individuals or families who lack decent housing, whether or not they own the land they occupy, whose income is within the poverty threshold — the beneficiary class the whole Act protects.</p>"}, {"num": "Socialized housing (Sec. 3(r), as amended by RA 10884)", "title": "Now expressly includes condominium units", "body": "<p>Housing programs and projects covering <span class='kw'>houses and lots or homelots only, OR residential condominium units</span>, undertaken by government or the private sector for the underprivileged and homeless — includes sites and services development, long-term financing, and liberalized interest terms.</p><div class='trap-box'><span class='lbl'>TRAP</span><span>Before RA 10884 (2016), the definition of 'socialized housing' under RA 7279 did not expressly include condominium units — this is precisely why balanced housing had to be extended to condo developers.</span></div>"}, {"num": "Professional squatters (Sec. 3)", "title": "Distinguished from ordinary informal settlers", "body": "<p>Persons who occupy land without the owner's consent <span class='kw'>despite having sufficient income</span> for legitimate housing, or who previously received government housing assistance but sold/transferred it and illegally occupied another area, or non-bona fide occupants of land reserved for socialized housing.</p>"}, {"num": "Squatting syndicates (Sec. 3)", "title": "Organized groups", "body": "<p>Groups of persons engaged in the business of squatting for profit — i.e., illegally occupying lands and further selling, leasing, or renting them to interested parties.</p>"}]}, {"heading": "National Housing Program and Beneficiary System", "tag": "", "sections": [{"num": "National Housing Program", "title": "Framework plan", "body": "<p>UDHA mandates a comprehensive and continuing <span class='kw'>national urban development and housing program</span>, including inventory of lands, identification of beneficiaries, and priority in disposition of lands for socialized housing.</p>"}, {"num": "Priorities in land acquisition", "title": "Order of preference", "body": "<p>Lands for socialized housing shall be acquired in the following order: (1) government lands, (2) alienable and disposable lands, (3) unregistered/abandoned/idle lands, (4) BLISS sites, (5) privately owned lands.</p>"}, {"num": "Land Use Priority", "title": "Direction of disposition", "body": "<p>Socialized housing beneficiaries must be registered by the LGU; priority given to actual occupants of the area first, in accordance with Sec. 17.</p>"}]}];
const balancedArticles=[{"heading": "RA 7279 Sec. 18 — Original Balanced Housing (1992)", "tag": "20% rule", "sections": [{"num": "The original rule", "title": "5+ hectares, 20% allocation", "body": "<p>All real estate developers of housing projects covering <span class='kw'>FIVE (5) HECTARES OR MORE</span> must allocate at least <span class='kw'>TWENTY PERCENT (20%)</span> of the total project area OR of the total number of housing units for socialized housing.</p>"}, {"num": "Compliance options (original, before RA 10884)", "title": "How developers may satisfy the requirement", "body": "<ul><li>Development of socialized housing within the same subdivision (on-site)</li><li>Development of a new settlement (off-site)</li><li>Slum upgrading or renewal</li><li>Joint-venture with LGUs/NGOs/other developers</li><li>Participation in the community mortgage program (CMP)</li><li>Participation in other government housing programs</li></ul>"}]}, {"heading": "RA 10884 (2016) — Amended Sec. 18", "tag": "15% subdivision / 5% condo", "sections": [{"num": "The new rates", "title": "15% subdivision / 5% condominium", "body": "<p>RA 10884 replaced the flat 5-hectare/20% trigger. Owners/developers of proposed <span class='kw'>SUBDIVISION</span> projects must develop socialized housing equivalent to at least <span class='kw'>15%</span> of the total subdivision area OR total project cost. Owners/developers of proposed <span class='kw'>CONDOMINIUM</span> projects must allocate at least <span class='kw'>5%</span> of the condominium area or project cost, <span class='kw'>at the option of the developer</span> (area vs. cost).</p><div class='trap-box'><span class='lbl'>TRAP</span><span>The area-vs-cost choice belongs to the DEVELOPER, not the regulator or the buyer. Also: RA 10884 extended the requirement to CONDOMINIUM developers for the first time — RA 7279 (1992) originally covered subdivisions only.</span></div>"}, {"num": "Exemption", "title": "Socialized projects are exempt", "body": "<p>Proposed <span class='kw'>socialized subdivision</span> and <span class='kw'>socialized condominium</span> projects are themselves EXEMPT from the balanced housing requirement — you cannot require a socialized project to subsidize another socialized project.</p>"}, {"num": "Price ceilings", "title": "HUDCC + NEDA, reviewed biennially", "body": "<p>HUDCC and NEDA <span class='kw'>jointly</span> determine and set separate socialized housing price ceilings for socialized subdivision and socialized condominium projects, <span class='kw'>mandatorily reviewed every two (2) years</span>.</p>"}, {"num": "Compliance options (as amended, Sec. 20 renumbering / Sec. 18-c)", "title": "Three now-simplified options", "body": "<ol><li>Development of socialized housing in a new settlement</li><li>Joint-venture projects with LGUs, housing agencies, another private developer, or an HLURB-accredited NGO — with <span class='kw'>solidary liability</span> only to the extent of compliance if the joint-venture partner fails to complete the project</li><li>Participation in a new project under the <span class='kw'>Community Mortgage Program (CMP)</span></li></ol>"}, {"num": "Penalties for non-compliance", "title": "Escalating sanctions", "body": "<p>1st offense: fine of <span class='kw'>not less than ₱500,000</span>. 2nd offense: suspension of license to do business for <span class='kw'>3 to 6 months</span> plus a fine of not less than ₱500,000. 3rd offense: <span class='kw'>cancellation</span> of license to do business.</p>"}]}, {"heading": "Sec. 20 (as amended) — Incentives and IRR Mandate", "tag": "", "sections": [{"num": "Private sector incentives", "title": "Sec. 20 (as amended)", "body": "<ul><li>Reduced/simplified qualification and accreditation requirements</li><li>One-stop offices for processing clearances/permits/licenses — issued within <span class='kw'>90 days</span> from submission of complete requirements</li><li>Simplified financing procedures</li><li>Exemptions: project-related income tax, capital gains tax on raw land, VAT for the contractor, transfer tax (raw and completed projects), and donor's tax on land donated for socialized housing</li></ul><div class='trap-box'><span class='lbl'>TRAP</span><span>The 90-day rule applies to the ISSUANCE of clearances/permits/licenses by one-stop offices — not to the balanced housing area/cost percentage, and not to project completion.</span></div>"}, {"num": "Certification and annotation", "title": "How exemption is enforced", "body": "<p>A socialized-housing certification from HLURB/DHSUD is sufficient basis for the tax exemptions; the Register of Deeds <span class='kw'>annotates a lien</span> on the title upon application for exemption, and all savings from the incentives must accrue to the beneficiaries.</p>"}, {"num": "IRR mandate (Sec. 3, RA 10884)", "title": "90-day deadline for new IRR", "body": "<p>HLURB was mandated to promulgate a <span class='kw'>new IRR</span> for the amended Secs. 3, 18 and 20 within <span class='kw'>90 days</span> from RA 10884's effectivity, in consultation with NGOs/POs and the private sector.</p><div class='trap-box'><span class='lbl'>TRAP</span><span>Two different '90-day' rules exist in this topic — don't merge them: (1) 90 days for HLURB to issue clearances/permits under the incentive scheme (Sec. 20), and (2) 90 days for HLURB to issue the IMPLEMENTING RULES of RA 10884 itself (Sec. 3 of RA 10884).</span></div>"}, {"num": "Reporting duties", "title": "Annual and biennial reports", "body": "<p>HLURB/DHSUD must submit an <span class='kw'>annual report</span> to Congress on developer compliance with balanced housing, and an evaluation report <span class='kw'>every two years</span>.</p>"}]}];
const evictionArticles=[{"heading": "Section 28 — When Eviction/Demolition Is Allowed", "tag": "General rule + exceptions", "sections": [{"num": "General rule", "title": "No eviction without compliance", "body": "<p>Eviction or demolition as a practice shall be discouraged; when unavoidable, it shall be observed in accordance with the constitutional 'just and humane manner' mandate and Sec. 28's procedural safeguards.</p>"}, {"num": "When eviction/demolition may be allowed", "title": "Enumerated grounds", "body": "<ul><li>Persons or entities occupying <span class='kw'>danger areas</span> (esteros, railroad tracks, garbage dumps, riverbanks, shorelines, waterways, easements, and other public places)</li><li>Government infrastructure projects with available funding</li><li>Court orders for eviction/demolition</li></ul>"}, {"num": "Summary eviction (no full Sec. 28 procedure needed)", "title": "New squatters and professional squatters/syndicates", "body": "<p>Summary eviction is authorized for: (1) persons who built structures <span class='kw'>AFTER the effectivity of RA 7279</span> (March 28, 1992 per most references), and (2) any person or group identified as a <span class='kw'>professional squatter</span> or member of a <span class='kw'>squatting syndicate</span> (Sec. 27).</p><div class='trap-box'><span class='lbl'>TRAP</span><span>A general assertion that all residents are 'squatters' is NOT sufficient authority for immediate/summary demolition. The classification (new squatter vs. long-time occupant vs. professional squatter) must be properly established — Kalipunan ng Damayang Mahihirap v. Robredo (2014).</span></div>"}]}, {"heading": "Procedural Safeguards for Non-Summary Eviction", "tag": "The Sec. 28 checklist", "sections": [{"num": "Required steps", "title": "Just and humane manner requirements", "body": "<ol><li><span class='kw'>30-day</span> prior notice to affected families</li><li>Adequate consultation with affected families on the eviction/demolition and its resettlement</li><li>Presence of LGU officials or their representatives during eviction/demolition</li><li>Proper identification of all persons taking part in the demolition</li><li>Execution of eviction/demolition only during <span class='kw'>regular office hours, daytime</span>, and NOT during rainy season, unless the affected families consent otherwise</li><li>No use of <span class='kw'>heavy equipment</span> for demolition except for permanent/dangerous structures, with proper hearing prior</li><li>Proper <span class='kw'>uniforms</span> and identification of demolition team members</li><li>Adequate <span class='kw'>relocation</span>, whether temporary or permanent</li></ol>"}, {"num": "Relocation requirement", "title": "Not automatic waiver", "body": "<p>Adequate relocation (temporary or permanent) must generally be provided, <span class='kw'>except</span> in cases of eviction from danger areas or government infrastructure projects with available funding for resettlement — even then, notice and consultation still generally apply.</p>"}]}, {"heading": "Enforcement and Adjudication Today", "tag": "", "sections": [{"num": "PCUP as Clearing House", "title": "EO 152, s. 2002", "body": "<p>The Presidential Commission for the Urban Poor is designated the <span class='kw'>sole Clearing House</span> for all eviction/demolition activities involving homeless and underprivileged citizens, to ensure Sec. 28 compliance before any demolition proceeds.</p>"}, {"num": "Building official vs. mayor", "title": "Who has authority to order demolition for lack of permit", "body": "<p>Lack of a building permit <span class='kw'>alone</span> does NOT justify summary demolition ordered directly by the city mayor — the proper procedure and the authority of the <span class='kw'>building official</span> (not the mayor acting alone) must be followed (Alangdeo v. City Mayor of Baguio, 2015).</p>"}, {"num": "Due process for informal settlers", "title": "Even without ownership", "body": "<p>Even informal settlers retain <span class='kw'>due process rights</span> in eviction proceedings — RA 7279's safeguards apply regardless of the occupants' lack of title.</p>"}]}];
const relatedArticles=[{"heading": "Housing and Buyer-Protection Family", "tag": "", "sections": [{"num": "PD 957 (1976)", "title": "Subdivision and Condominium Buyers' Protective Decree", "body": "<p>Regulates the sale/registration side of subdivisions and condos; UDHA instead focuses on socialized housing supply and the protection of informal settlers — a different, complementary focus.</p>"}, {"num": "BP 220 (1982)", "title": "Economic and socialized housing design standards", "body": "<p>Sets the technical/design standards (lot sizes, road widths) developers must follow when actually building the socialized housing units required by UDHA's balanced housing mandate.</p>"}, {"num": "PD 1344 (1978)", "title": "NHA writ of execution", "body": "<p>Gives the housing regulator power to enforce PD 957 decisions; UDHA disputes are instead adjudicated by HSAC (post-2019), appealable via Rule 43 to the CA.</p>"}]}, {"heading": "Regulatory Lineage and Companion Laws", "tag": "", "sections": [{"num": "EO 152, s. 2002", "title": "PCUP as Clearing House", "body": "<p>Ensures Sec. 28 procedural compliance before any eviction/demolition of underprivileged/homeless citizens proceeds.</p>"}, {"num": "RA 11201 (2019) — DHSUD Act", "title": "Current implementing structure", "body": "<p>Creates DHSUD (absorbing HUDCC and HLURB) and HSAC; UDHA implementation and adjudication now run through these bodies instead of the original NHA/HUDCC/HLURB triad.</p>"}, {"num": "RA 9646 — RESA Law", "title": "Professional relevance", "body": "<p>Brokers/appraisers handling subdivision or condo projects must know whether balanced housing compliance affects project viability, pricing, and the Certificate of Occupancy.</p>"}, {"num": "Community Mortgage Program (CMP)", "title": "Social Housing Finance Corporation (SHFC)", "body": "<p>A financing scheme allowing legally organized associations of underprivileged/homeless citizens to purchase land they occupy or land elsewhere collectively — one of the recognized ways developers/LGUs may comply with balanced housing.</p>"}]}];

ilding official must be followed; the mayor cannot order summary demolition on that ground alone."}, {"t": "Socialized housing projects must also comply with the balanced housing requirement", "b": "False — proposed socialized subdivision/condominium projects are themselves EXEMPT from balanced housing."}, {"t": "HLURB still regulates and adjudicates UDHA matters today", "b": "Outdated — RA 11201 (2019) created DHSUD (absorbing HLURB and HUDCC) and HSAC, which now handle regulation and adjudication respectively."}];

const viewRoot=document.getElementById('viewRoot');const topbarTitle=document.getElementById('topbarTitle');let currentTab='home';let quizIdx=0,quizScore=0,quizAnswered=false;
function accordionHTML(articles){
  return articles.map((art) => `
    <div class="article-block">
      <div class="article-heading"><span>${art.heading}</span><span class="tag">${art.tag}</span></div>
      ${art.sections.map((s) => `
        <div class="sec-card" data-search="${(s.title+' '+s.num+' '+s.body+(s.trap||'')).toLowerCase().replace(/"/g,'&quot;')}">
          <button class="sec-head" onclick="toggleSec(this)">
            <span class="sec-num">${s.num}</span>
            <span class="sec-title">${s.title}</span>
            <svg class="sec-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="sec-body"><div class="sec-body-inner">
            ${s.body}
            ${s.trap ? `<div class="trap-box"><span class="lbl">TRAP</span><span>${s.trap}</span></div>` : ''}
          </div></div>
        </div>
      `).join('')}
    </div>
  `).join('');
}

function toggleSec(btn){
  const card = btn.closest('.sec-card');
  const body = card.querySelector('.sec-body');
  const isOpen = card.classList.contains('open');
  if(isOpen){
    card.classList.remove('open');
    body.style.maxHeight = null;
  } else {
    card.classList.add('open');
    body.style.maxHeight = body.scrollHeight + 40 + 'px';
  }
}

}

function renderQuiz(reset){
  topbarTitle.textContent = 'Self-Test Quiz';
  if(reset){ quizIdx = 0; quizScore = 0; }
  quizAnswered = false;

  if(quizIdx >= quiz.length){
    viewRoot.innerHTML = `
      <div class="view-header">
        <div class="eyebrow-row"><span class="badge-pill">Results</span></div>
        <h1 class="view-title">Quiz Complete</h1>
      </div>
      <div class="quiz-box">
        <div class="quiz-score">${quizScore} / ${quiz.length} correct
          <div class="sub">${quizScore === quiz.length ? "Perfect score — ready for the board." : quizScore/quiz.length >= 0.7 ? "Solid — review the misses below and go again." : "Keep drilling the percentages and the eviction checklist, then retake."}</div>
        </div>
        <div class="quiz-nav" style="justify-content:center;">
          <button class="btn" onclick="renderQuiz(true)">Retake Quiz</button>
        </div>
      </div>
    `;
    return;
  }

  const item = quiz[quizIdx];
  viewRoot.innerHTML = `
    <div class="view-header">
      <div class="eyebrow-row"><span class="badge-pill">Self-Test</span></div>
      <h1 class="view-title">UDHA Quiz</h1>
      <p class="view-sub">Questions on RA 7279, RA 10884, balanced housing math, and eviction/demolition rules.</p>
    </div>
    <div class="quiz-box">
      <div class="quiz-progress">Question ${quizIdx+1} of ${quiz.length} &nbsp;·&nbsp; Score so far: ${quizScore}</div>
      <div class="quiz-q">${item.q}</div>
      <div class="quiz-opts">
        ${item.opts.map((o,i) => `<button class="quiz-opt" onclick="answerQuiz(${i})">${o}</button>`).join('')}
      </div>
      <div class="quiz-explain" id="quizExplain">${item.ex}</div>
      <div class="quiz-nav">
        <button class="btn ghost" onclick="renderQuiz(true)">Restart</button>
        <button class="btn" id="quizNextBtn" style="opacity:.4; pointer-events:none;" onclick="nextQuiz()">Next →</button>
      </div>
    </div>
  `;
}

function answerQuiz(i){
  if(quizAnswered) return;
  quizAnswered = true;
  const item = quiz[quizIdx];
  const opts = document.querySelectorAll('.quiz-opt');
  opts.forEach((btn, idx) => {
    btn.classList.add('disabled');
    if(idx === item.a) btn.classList.add('correct');
    else if(idx === i) btn.classList.add('wrong');
  });
  if(i === item.a) quizScore++;
  document.getElementById('quizExplain').classList.add('show');
  const nb = document.getElementById('quizNextBtn');
  nb.style.opacity = 1;
  nb.style.pointerEvents = 'auto';
}

function nextQuiz(){
  quizIdx++;
  renderQuiz(false);
}

/* ============================================================
   TAB SWITCHING + SEARCH
   ============================================================ */
const renderers = {
  home: renderHome, udha: renderUdha, balanced: renderBalanced, eviction: renderEviction, related: renderRelated,
  dates: renderDates, people: renderPeople, glossary: renderGlossary, traps: renderTraps,
  quiz: () => renderQuiz(true)
};

function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.getElementById('searchInput').value = '';
  renderers[tab]();
  window.scrollTo(0,0);
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => switchTab(btn.dataset.tab));
});

document.getElementById('searchInput').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  const searchable = document.querySelectorAll('[data-search]');
  if(!q){
    searchable.forEach(el => el.classList.remove('hidden'));
    document.querySelectorAll('.article-block, .article-heading').forEach(el => el.classList.remove('hidden'));
    const nores = document.getElementById('noResults');
    if(nores) nores.remove();
    return;
  }
  let anyVisible = false;
  searchable.forEach(el => {
    const match = el.dataset.search.includes(q);
    el.classList.toggle('hidden', !match);
    if(match) anyVisible = true;
    if(match && el.classList.contains('sec-card')){
      el.classList.add('open');
      const body = el.querySelector('.sec-body');
      if(body) body.style.maxHeight = body.scrollHeight + 40 + 'px';
    }
  });
  let nores = document.getElementById('noResults');
  if(!anyVisible){
    if(!nores){
      nores = document.createElement('div');
      nores.id = 'noResults';
      nores.className = 'nores';
      nores.textContent = 'No matches in this section. Try another tab.';
      viewRoot.appendChild(nores);
    }
  } else if(nores){
    nores.remove();
  }
});

/* init */
renderHome();
</script>
</body>
</html>
